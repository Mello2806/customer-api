spring.application.name=customer-api
server.port=8080

# --- Banco de dados (o mesmo do customer-management-system) ---
# A senha NÃO fica aqui: vem do arquivo local db.properties (fora do git)
# ou das variáveis de ambiente DB_URL / DB_USUARIO / DB_SENHA.
spring.config.import=optional:file:./db.properties
spring.datasource.url=${db.url:jdbc:postgresql://localhost:5432/clientes_db}
spring.datasource.username=${db.usuario:clientes_app}
spring.datasource.password=${db.senha:}

# A tabela já existe (criada pelo sql/schema.sql do outro projeto): o Hibernate não mexe nela.
spring.jpa.hibernate.ddl-auto=none
# Evita manter a conexão aberta durante a renderização da resposta (boa prática).
spring.jpa.open-in-view=false
